service: day13-l3b-monitoring-llmops-lab
primary_slo:
  name: fast_successful_requests
  window: 28d
  sli:
    good_event: 'event == "response_sent" and latency_ms <= 3000'
    total_event: 'event == "request_received"'
  target_percent: 99.5
  error_budget_percent: 0.5
  note: >
    Baseline của tôi (10 request, fake LLM): latency 150-151ms, quality avg 0.88, không lỗi, nên ngưỡng 3000ms còn dư rất nhiều headroom
    (rag_slow thêm ~2.5s vẫn còn dưới ngưỡng nhưng P95 sẽ tiến sát). Giữ SLO 99.5% trong 28 ngày.
    Error budget = 100% - 99.5% = 0.5%. Ví dụ 10,000 request trong 28 ngày thì tối đa 50 request được phép lỗi hoặc chậm hơn 3000ms.