alerts:
  - name: HighLatencyP95
    severity: warning
    condition: 'p95(latency_ms) > 3000 (event == "response_sent")'
    duration: 5m
    type: symptom-based
    channel: slack
    slack_channel: "#k4-l3b-alerts"
    owner: student-2A202602367
    runbook: docs/alerts.md#alert-1
  - name: HighErrorRateOrRetrievalFailure
    severity: critical
    condition: 'error_rate_pct > 2 OR retrieval_success_rate_pct < 90 (request_failed / request_received)'
    duration: 3m
    type: symptom-based
    channel: slack
    slack_channel: "#k4-l3b-alerts"
    owner: student-2A202602367
    runbook: docs/alerts.md#alert-2
  - name: CostOrQualityRegression
    severity: warning
    condition: 'daily_cost_usd > 2.5 OR avg(quality_score) < 0.75 (event == "response_sent")'
    duration: 10m
    type: symptom-based
    channel: slack
    slack_channel: "#k4-l3b-alerts"
    owner: student-2A202602367
    runbook: docs/alerts.md#alert-3
